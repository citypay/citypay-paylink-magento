<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label class="label" data-bind="attr: {'for': getCode()}">
            <img data-bind="attr: {src: require.toUrl('CityPay_Paylink/images/citypay-logo.svg')}" alt="CityPay" style="vertical-align: middle; max-height: 30px"/>
        </label>
    </div>

    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <!-- ko if: isElementsMode() -->
        <div>
            <style>
                .citypay-wallet-grid {
                    display: grid;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    align-items: center;
                    gap: 12px;
                    width: 100%;
                    max-height: 0;
                    overflow: hidden;
                    visibility: hidden;
                }

                .citypay-wallet-grid--ready {
                    max-height: none;
                    overflow: visible;
                    visibility: visible;
                }

                .citypay-wallet-slot {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 100%;
                    min-width: 0;
                    min-height: 54px;
                    padding: 6px 0;
                    box-sizing: border-box;
                }

                .citypay-wallet-grid--ready .citypay-wallet-slot:empty {
                    display: none;
                }

                .citypay-wallet-grid--ready:has(.citypay-wallet-slot:empty)
                .citypay-wallet-slot:not(:empty) {
                    grid-column: 1 / -1;
                    justify-self: center;
                    max-width: 315px;
                }

                .citypay-wallet-separator {
                    display: none;
                    width: 100%;
                    flex-direction: row;
                    justify-content: center;
                    align-items: center;
                    margin: 20px 0;
                }

                .citypay-wallet-grid:has(
                    button.apple-pay-button,
                    button.gpay-button
                ) + .citypay-wallet-separator {
                    display: flex;
                }

                .citypay-wallet-slot button.apple-pay-button {
                    display: block;
                    width: 100% !important;
                    max-width: none !important;
                    height: 42px !important;
                    min-height: 42px !important;
                    max-height: 42px !important;
                    box-sizing: border-box;
                    flex: 1 1 auto;
                    margin: 0;
                    padding: 0;
                    border: 0;
                }

                #google-pay > div {
                    display: flex !important;
                    align-items: stretch;
                    width: 100% !important;
                    max-width: none !important;
                    height: 42px !important;
                    margin: 0;
                }

                #google-pay button.gpay-button {
                    display: block;
                    width: 100% !important;
                    max-width: none !important;
                    height: 42px !important;
                    min-height: 42px !important;
                    max-height: 42px !important;
                    box-sizing: border-box;
                    flex: 1 1 auto;
                    margin: 0;
                }

                @media only screen and (max-width: 767px) {
                    .citypay-wallet-grid {
                        grid-template-columns: minmax(0, 1fr);
                    }
                }
            </style>

            <div id="citypay-wallet-grid" class="citypay-wallet-grid">
                <!-- Google Pay -->
                <div id="google-pay" class="citypay-wallet-slot google-pay"></div>

                <!-- Apple Pay -->
                <div id="apple-pay" class="citypay-wallet-slot apple-pay"></div>
            </div>

            <!-- Separator -->
            <div class="citypay-wallet-separator">
                <div style="width: 20%; border: 1px solid gray; margin-top: 20px; margin-bottom: 20px; margin-right: 5px;"></div>
                <div>or pay by card</div>
                <div style="width: 20%; border: 1px solid gray; margin-top: 20px; margin-bottom: 20px; margin-left: 5px"></div>
            </div>

            <!-- Elements Card Form -->
            <div id="card-form" data-bind="afterRender: onCardFormRendered" style="width: 100%; margin-bottom: 10px;"></div>
        </div>
        <!-- /ko -->

        <div class="actions-toolbar">
            <div class="primary">

                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                          click: placeOrder,
                          enable: isPlaceOrderActionAllowed,
                          css: {'disabled': !isPlaceOrderActionAllowed()},
                          attr: {
                              title: isPlaceOrderActionAllowed()
                                  ? $t('Place Order')
                                  : $t('Processing payment'),
                              'aria-busy': !isPlaceOrderActionAllowed()
                          }
                      ">
                    <span data-bind="
                        text: isPlaceOrderActionAllowed() ? $t('Place Order') : $t('Processing payment...')
                    "></span>
                </button>
            </div>
        </div>

        <p style="font-size: 80%; opacity: 60%; margin-top: 10px;">
            <img data-bind="attr: {src: require.toUrl('CityPay_Paylink/images/citypay-secure.svg')}" width="20" alt="" style="display: inline; vertical-align: middle" />
            CityPay is a PCI-DSS level 1 certified payment provider
        </p>
    </div>
</div>
