<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label class="label" data-bind="attr: {'for': getCode()}">
            <img data-bind="attr: {src: require.toUrl('CityPay_Paylink/images/citypay-logo.svg')}" alt="CityPay" style="vertical-align: middle; max-height: 30px"/>
        </label>
    </div>

    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <!-- ko if: isElementsMode() -->
        <div>
            <!-- Apple Pay -->
            <div id="apple-pay" class="apple-pay" style="width: 100%; border: 1px solid red">Apple Pay</div>

            <!-- Separator -->
            <div style="width: 100%; display: flex; flex-direction: row; justify-content: center; align-items: center;">
                <div style="width: 20%; border: 1px solid gray; margin-top: 20px; margin-bottom: 20px; margin-right: 5px;"></div>
                <div>or pay by card</div>
                <div style="width: 20%; border: 1px solid gray; margin-top: 20px; margin-bottom: 20px; margin-left: 5px"></div>
            </div>

            <!-- Elements Card Form -->
            <div id="card-form" data-bind="afterRender: onCardFormRendered" style="width: 100%; margin-bottom: 10px;"></div>
        </div>
        <!-- /ko -->

        <div class="actions-toolbar">
            <div class="primary">

                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order')}
                        ">
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>

        <p style="font-size: 80%; opacity: 60%; ">
            <img data-bind="attr: {src: require.toUrl('CityPay_Paylink/images/citypay-secure.svg')}" width="20" alt="" style="display: inline; vertical-align: middle" />
            CityPay is a PCI-DSS level 1 certified payment provider
        </p>
    </div>
</div>
