services:
  app:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    extra_hosts:
      - "dev.citypay.local:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_MEMORY_LIMIT: "-1"
      PHP_MEMORY_LIMIT: "2048M"
    volumes:
      - ../magento-install/src:/var/www/html
      - ${CITYPAY_PLUGIN_DIR}:/var/www/html/app/code/CityPay/Paylink
    networks: [magento-net]
    depends_on:
      - db
      - opensearch

  nginx:
    build:
      context: ./docker/nginx
      args:
        NGROK_ARCH: ${NGROK_ARCH:-linux-arm64}
    image: local/magento-nginx-with-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}   # optional reserved domain
    ports:
      - "${MAGENTO_PORT_BIND:-8081}:80"     # storefront/admin
    #      - "4040:4040"   # ngrok local API (read by init.sh)
    volumes:
      - ../magento-install/src:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - app
    networks: [ magento-net ]

  db:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    command: >
      --default-authentication-plugin=mysql_native_password
      --log-bin-trust-function-creators=1
    volumes:
      - db_data:/var/lib/mysql
    networks: [magento-net]

  opensearch:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD="Cx7^Lime-Vault!92"
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"   # so init.sh can wait on host:9200
    networks: [magento-net]

volumes:
  db_data:

networks:
  magento-net:
    driver: bridge
