# /etc/nginx/conf.d/magento.conf  (replace default.conf or disable it)
server {
  listen 80 default_server;
  server_name _;
  root /var/www/html/pub;                 # Magento must serve from pub/
  index index.php index.html;

  # Front controller: let Magento handle routes
  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  # Static assets: serve if present, otherwise hand to Magento
  location ^~ /static/ {
    try_files $uri $uri/ /index.php?$args;
  }

  # Media: same idea
  location ^~ /media/ {
    try_files $uri $uri/ /index.php?$args;
  }

  # Never execute PHP from /static or /media
  location ~* ^/(static|media)/.*\.php$ { return 404; }

  # PHP-FPM
  location ~ \.php$ {
    include /etc/nginx/fastcgi_params;
    fastcgi_read_timeout 600s;

    # correct SCRIPT_FILENAME
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   $document_root;

    # If PHP-FPM runs in a sibling container named "app", keep this:
    fastcgi_pass app:9000;
    # If your PHP service is "php-fpm", use:   fastcgi_pass php-fpm:9000;
    # If PHP-FPM is local:                     fastcgi_pass 127.0.0.1:9000;

    fastcgi_index index.php;
  }

  # Buffers / uploads (safe defaults)
  client_max_body_size 64M;
  fastcgi_buffer_size 64k;
  fastcgi_buffers 16 32k;
  fastcgi_busy_buffers_size 128k;

  # Optional: simple cache headers for static files already in pub/static
  location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
    expires 1M;
    access_log off;
  }
}