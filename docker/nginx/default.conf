map $http_x_forwarded_host $magento_host {
  default $http_x_forwarded_host;
  "" $http_host;
}

map $http_x_forwarded_proto $magento_scheme {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $magento_scheme $magento_https {
  https on;
  default "";
}

map $http_x_forwarded_proto $magento_server_port {
  https 443;
  default $server_port;
}

server {
  listen 80 default_server;
  server_name _;
  root /var/www/html/pub;
  index index.php index.html;

  # Front controller
  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  # Static assets in developer mode: fallback to static.php when files are not materialized yet
  location /static/ {
    location ~ ^/static/version\d*/ {
      rewrite ^/static/(version\d*/)?(.*)$ /static/$2 last;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|svgz|webp|js|css|woff|woff2|ttf|otf|eot)$ {
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
      add_header X-Frame-Options "SAMEORIGIN";
      expires off;
      if (!-f $request_filename) {
        rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
      }
    }

    location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
      add_header Cache-Control "no-store";
      add_header X-Frame-Options "SAMEORIGIN";
      expires off;
      if (!-f $request_filename) {
        rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
      }
    }

    if (!-f $request_filename) {
      rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
    }
    add_header X-Frame-Options "SAMEORIGIN";
  }

  # Media fallback to get.php
  location /media/ {
    try_files $uri $uri/ /get.php$is_args$args;

    location ~ ^/media/theme_customization/.*\.xml {
      deny all;
    }
  }

  location ~ (index|get|static|report|404|503)\.php$ {
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param HTTP_HOST $magento_host;
    fastcgi_param SERVER_NAME $magento_host;
    fastcgi_param SERVER_PORT $magento_server_port;
    fastcgi_param REQUEST_SCHEME $magento_scheme;
    fastcgi_param HTTPS $magento_https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_PROTO $magento_scheme;
    fastcgi_param HTTP_X_FORWARDED_SSL $magento_https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_HOST $magento_host;
    fastcgi_param HTTP_X_FORWARDED_PORT $magento_server_port;
    fastcgi_pass app:9000;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_index index.php;
  }

  location ~* \.php$ {
    deny all;
  }

  location /. {
    deny all;
  }

  client_max_body_size 64M;
}
